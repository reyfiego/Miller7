<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <div class="topbar">
      <div class="brand-container">
        <div class="brand">Chat<span>AI</span></div>
        <img src="macmiller.gif" alt="GIF" class="macmiller-gif">
      </div>
      <div class="header-buttons">
        <button class="btn">Perfil</button>
        <button class="btn">Ajustes</button>
      </div>
    </div>

    <!-- CHAT CENTRAL -->
    <div class="chat-wrapper">
      <div class="chat">
        <div class="bubble ai">Hola, ¿cómo estás?</div>
        <div class="bubble you">¡Bien! ¿Y tú?</div>
        <!-- Más burbujas se añadirán aquí dinámicamente -->
      </div>
    </div>

    <!-- FOOTER COMPOSER - siempre abajo -->
    <footer class="composer">
      <form id="composer-form">
        <input type="text" id="prompt" placeholder="Escribe un mensaje..."/>
        <button id="send">Enviar</button>
      </form>
    </footer>

    <!-- OVERLAY DE VOZ -->
    <div id="voice-overlay">
      <div id="wave-bar">
        <div class="wave-level"></div>
      </div>
      <div class="voice-actions">
        <button id="start-voice">🎤</button>
        <button id="stop-voice">⏹️</button>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <span id="close-modal">&times;</span>
        <p>Este es un modal de prueba.</p>
      </div>
    </div>

    <!-- SECCIONES LOGIN Y REGISTRO -->
    <div class="form-section" id="login-section">
      <form>
        <h2>Iniciar sesión</h2>
        <label for="login-email">Correo
          <input type="email" id="login-email" placeholder="Correo electrónico">
        </label>
        <label for="login-password">Contraseña
          <input type="password" id="login-password" placeholder="Contraseña">
        </label>
        <div class="g-recaptcha" data-sitekey="TU_SITE_KEY"></div>
        <button type="submit">Ingresar</button>
      </form>
    </div>

    <div class="form-section" id="register-section">
      <form>
        <h2>Registro</h2>
        <label for="register-email">Correo
          <input type="email" id="register-email" placeholder="Correo electrónico">
        </label>
        <label for="register-password">Contraseña
          <input type="password" id="register-password" placeholder="Contraseña">
        </label>
        <div class="g-recaptcha" data-sitekey="TU_SITE_KEY"></div>
        <button type="submit">Registrarse</button>
      </form>
    </div>
  </div>

  <!-- SCRIPT opcional para mostrar el modal -->
  <script>
    const modal = document.getElementById('modal');
    const closeModal = document.getElementById('close-modal');
    closeModal.onclick = () => modal.style.display = 'none';
    window.onclick = (e) => { if(e.target === modal) modal.style.display = 'none'; }
  </script>
</body>
</html>
