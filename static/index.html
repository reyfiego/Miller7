<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Miller2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/static/style.css" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-container">
        <div class="brand">Miller<span>2</span></div>
        <img class="brand-gif" src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExYTJmMjRjbG1senF1NXVyZTB0MDg2ZTl2OW90Zng2ZTJqaG4ya2M1OSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/gj0pAC4W4uq1uq84oe/giphy.gif" alt="GIF"/>
      </div>

      <div class="header-buttons">
        <button class="login-btn">Iniciar sesión</button>
        <button class="register-btn">Registro</button>
        <button class="info-btn">?</button>
      </div>
    </header>

    <main id="chat" class="chat"></main>

    <footer class="composer">
      <form id="composer-form">
        <input id="prompt" type="text" placeholder="Escribe aquí..." autocomplete="off" />
        <button id="send" type="submit">⮕</button>
      </form>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
