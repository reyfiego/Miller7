<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Miller1</title>
  <meta name="viewport" content="width=1024" />
  <link href="/static/style.css" rel="stylesheet" />

</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-container">
        <div class="brand">Miller<span>1</span></div>
      </div>
      <div class="header-buttons">
        <button id="login-btn" class="btn-audio-style">Iniciar sesión</button>
        <button id="register-btn" class="btn-audio-style">Registro</button>
        <button id="info-btn" class="btn-audio-style">?</button>
      </div>
    </header>

    <div class="chat-wrapper">
      <main id="chat" class="chat"></main>
    </div>

    <footer class="composer">
      <form id="composer-form">
        <input id="prompt" type="text" placeholder="Escribe aquí..." autocomplete="off" />
        <button id="mic-btn" type="button" class="btn-mic">🎤</button>
        <button id="send" type="submit">⮕</button>
      </form>
    </footer>
  </div>

  <!-- Overlay oscuro para paneles -->
  <div id="panel-overlay" class="panel-overlay"></div>

  <!-- Overlay de voz -->
  <div id="voice-overlay">
    <div id="wave-bar">
      <div class="wave-level"></div>
    </div>
    <div class="voice-actions">
      <button id="confirm">✔️</button>
      <button id="cancel">❌</button>
    </div>
  </div>

  <!-- Modal info -->
  <div id="info-modal" class="modal">
    <div class="modal-content">
      <span id="close-modal">&times;</span>
      <h2>
        Acerca de <span class="brand">Miller<span>1</span></span>
      </h2>
      <p>
        Miller1 es tu guía cercana creada para dar informacion respecto al derecho al patrimonio comun de la humanidad.
      </p>
    </div>
  </div>

  <!-- Panel Login -->
  <div id="login-panel" class="floating-panel">
    <div class="floating-header">
      <h2>Iniciar Sesión</h2>
      <span class="close-btn" id="close-login">&times;</span>
    </div>
    <form id="login-form">
      <input type="email" name="email" placeholder="Correo" required />
      <input type="password" name="password" placeholder="Contraseña" required />
      <div class="captcha-placeholder">[CAPTCHA]</div>
      <button type="submit">Entrar</button>
    </form>
  </div>

  <!-- Panel Registro -->
  <div id="register-panel" class="floating-panel">
    <div class="floating-header">
      <h2>Registro</h2>
      <span class="close-btn" id="close-register">&times;</span>
    </div>
    <form id="register-form">
      <input type="email" name="email" placeholder="Correo" required />
      <input type="password" name="password" placeholder="Contraseña" required />
      <div class="captcha-placeholder">[CAPTCHA]</div>
      <button type="submit">Crear cuenta</button>
    </form>
  </div>

  <script src="/static/app.js"></script>

</body>
</html>
