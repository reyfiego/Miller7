<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Miller2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="/static/style.css" rel="stylesheet">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="topbar">
    <div class="brand-container">
      <div class="brand">Miller<span>2</span></div>
      <img class="macmiller-gif" src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExYTJmMjRjbG1senF1NXVyZTB0MDg2ZTl2OW90Zng2ZTJqaG4ya2M1OSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/gj0pAC4W4uq1uq84oe/giphy.gif" alt="Logo GIF">
    </div>
    <div class="header-buttons">
      <button id="btn-show-login" class="btn">Login</button>
      <button id="btn-show-register" class="btn">Registro</button>
      <button id="info-btn" class="btn">?</button>
    </div>
  </header>

  <!-- SECCIONES -->
  <main>
    <!-- Chat -->
    <section id="chat-section" class="chat-wrapper">
      <main id="chat" class="chat"></main>
      <footer class="composer">
        <form id="composer-form">
          <input id="prompt" type="text" placeholder="Escribe aquí..." autocomplete="off">
          <button id="mic-btn" type="button" class="btn-mic">🎤</button>
          <button id="send" type="submit">⮕</button>
        </form>
      </footer>
    </section>

    <!-- Login -->
    <section id="login-section" class="form-section">
      <form id="login-form">
        <h2>Iniciar Sesión</h2>
        <input id="login-username" type="text" placeholder="Usuario" required>
        <input id="login-password" type="password" placeholder="Contraseña" required>
        <label><input type="checkbox" id="remember-login"> Recordarme</label>
        <div class="g-recaptcha" data-sitekey="TU_SITE_KEY"></div>
        <button type="submit" class="btn">Entrar</button>
      </form>
    </section>

    <!-- Registro -->
    <section id="register-section" class="form-section">
      <form id="register-form">
        <h2>Registro</h2>
        <input id="register-email" type="email" placeholder="Correo" required>
        <input id="register-username" type="text" placeholder="Usuario" required>
        <input id="register-password" type="password" placeholder="Contraseña" required>
        <label><input type="checkbox" id="remember-register"> Recordarme</label>
        <div class="g-recaptcha" data-sitekey="TU_SITE_KEY"></div>
        <button type="submit" class="btn">Registrarse</button>
      </form>
    </section>
  </main>

  <!-- Overlay de voz -->
  <div id="voice-overlay">
    <div id="wave-bar">
      <div class="wave-level"></div>
    </div>
    <div class="voice-actions">
      <button id="confirm">✔️</button>
      <button id="cancel">❌</button>
    </div>
  </div>

  <!-- Modal info -->
  <div id="info-modal" class="modal">
    <div class="modal-content">
      <span id="close-modal">&times;</span>
      <h2>Acerca de Miller2</h2>
      <p>Miller2 es tu guía cercana creada por Alessandro. Su estilo es cálido, humano y reflexivo, con un toque de melancolía.</p>
    </div>
  </div>

</div>

<script src="/static/app.js"></script>
</body>
</html>
