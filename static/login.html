<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login - Miller2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="/static/style.css" rel="stylesheet">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand-container">
      <div class="brand">Miller<span>2</span></div>
    </div>
  </header>

  <section class="auth-section">
    <h2>Login</h2>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Usuario" required>
      <input type="password" id="login-password" placeholder="Contraseña" required>
      
      <label class="remember-me">
        <input type="checkbox" id="login-remember"> Guardar sesiónes
      </label>
      
      <div class="g-recaptcha" data-sitekey="TU_SITE_KEY"></div>
      
      <button type="submit" class="btn" id="login-btn">Entrar</button>
      <p>¿No tienes cuenta? <a href="/register.html">Regístrate</a></p>
    </form>
  </section>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const loginForm = document.getElementById("login-form");
  const loginBtn = document.getElementById("login-btn");
  const authSection = document.querySelector(".auth-section");

  // Verifica si el usuario ya inició sesión
  const usuarioLogueado = localStorage.getItem("usuario");

  if (usuarioLogueado) {
    // Oculta el formulario de login
    loginForm.style.display = "none";

    // Mostrar mensaje de bienvenida
    const msg = document.createElement("p");
    msg.textContent = `Bienvenido, ${usuarioLogueado}!`;
    authSection.appendChild(msg);
  }

  // Manejo del login si no hay usuario logueado
  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const username = document.getElementById("login-username").value;

    // Guardar usuario en localStorage
    localStorage.setItem("usuario", username);

    // Recarga la página para actualizar la vista
    location.reload();
  });
});
</script>

</body>
</html>
