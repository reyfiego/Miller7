<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro - Miller2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="/static/style.css" rel="stylesheet">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand-container">
      <div class="brand">Miller<span>2</span></div>
    </div>
  </header>

  <section class="auth-section">
    <h2>Registro</h2>
    <form id="register-form">
      <input type="email" id="register-email" placeholder="Correo" required>
      <input type="text" id="register-username" placeholder="Usuario" required>
      <input type="password" id="register-password" placeholder="Contraseña" required>

      <label class="remember-me">
        <input type="checkbox" id="register-remember"> Guardar sesión
      </label>

      <div class="g-recaptcha" data-sitekey="TU_SITE_KEY"></div>

      <button type="submit" class="btn">Registrarse</button>
      <p>¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
    </form>
  </section>
</div>

<script src="/static/register.js"></script>
</body>
</html>
